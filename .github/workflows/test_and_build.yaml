# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Test and Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test_and_build: # Job principal de CI: instala, compila (si aplica) y prueba

    runs-on: ubuntu-latest # Ejecuta el job en un runner de Ubuntu gestionado por GitHub

    steps: # Pasos secuenciales del job
    - uses: actions/checkout@v4 # Clona el repositorio en el runner
    - name: Use Node.js 18.19.1 # Nombre visible del paso en Actions
      uses: actions/setup-node@v4 # Instala/configura Node.js
      with:
        node-version: 18.19.1 # Usa una versión fija de Node.js
        cache: 'npm' # Activa caché de dependencias npm para acelerar ejecuciones
    - run: npm ci # Instalación limpia y reproducible desde package-lock.json
    - run: npm run build --if-present # Ejecuta build solo si el script existe
    - run: npm test # Corre los tests; si fallan, falla el job
